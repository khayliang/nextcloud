services:
  nextcloud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: change-this-password
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 192.168.0.250"
      PHP_UPLOAD_LIMIT: 10G
      PHP_MEMORY_LIMIT: 1G
    volumes:
      - /srv/nextcloud/html:/var/www/html
